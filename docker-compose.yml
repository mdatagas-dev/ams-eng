name: ams-eng

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ams_eng
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ams_eng"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/ams_eng"
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      API_URL: "http://api:4000/api"
      NODE_ENV: "production"
      BOOTSTRAP_SUPERUSER_NAME: ${BOOTSTRAP_SUPERUSER_NAME:-}
      BOOTSTRAP_SUPERUSER_USERNAME: ${BOOTSTRAP_SUPERUSER_USERNAME:-}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["node", "dist/server/index.js"]
    ports:
      - "4000:4000"

  web:
    build: .
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/ams_eng"
      API_URL: "http://api:4000/api"
      NODE_ENV: "production"
    command: ["sh", "-c", "npm run db:deploy && npm start"]
    ports:
      - "3000:3000"

volumes:
  db-data:
